<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEME CASE — апгрейдер мем-скинов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d1120; --bg-2:#080b15; --surface:#151c31; --surface-2:#202a47; --surface-3:#2b385a;
    --border:rgba(214,228,255,.1); --text:#f3f7ff; --text-muted:#a4b1cb; --text-dim:#697994;
    --accent-purple:#647dff; --accent-pink:#38bdf8; --accent-orange:#ffc65a; --accent-green:#4ee0b5; --accent-red:#ff6d85;
    --r-common:#aab7d1; --r-rare:#55a7ff; --r-epic:#ae7cff; --r-legendary:#ffc55c;
    --nav-h:86px; --nav-surface:rgba(12,17,31,.87); --shadow:0 18px 50px rgba(0,0,0,.28);
  }
  body.theme-light{
    --bg:#edf3ff; --bg-2:#e3ecfa; --surface:#ffffff; --surface-2:#e8f0ff; --surface-3:#d9e5fb;
    --border:rgba(34,61,105,.13); --text:#17233b; --text-muted:#667892; --text-dim:#8798b0;
    --nav-surface:rgba(247,250,255,.88); --shadow:0 18px 46px rgba(70,95,135,.16);
  }
  body.accent-violet{--accent-purple:#8065ff;--accent-pink:#e76ee5;--accent-green:#4ee0b5;}
  body.accent-blue{--accent-purple:#287cf5;--accent-pink:#28c9ed;--accent-green:#32d6a0;}
  body.accent-mint{--accent-purple:#12a98d;--accent-pink:#41d5a3;--accent-green:#5ee9c4;}
  body.accent-sunset{--accent-purple:#f06a5d;--accent-pink:#fb9d4e;--accent-green:#60cf9b;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{background:radial-gradient(110% 82% at 50% -10%,color-mix(in srgb,var(--accent-purple) 25%,transparent),transparent 58%),var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center;-webkit-font-smoothing:antialiased;transition:background .35s ease,color .25s ease;}
  h1,h2,h3,.display{font-family:'Baloo 2',sans-serif;}
  button{font-family:inherit;transition:transform .18s ease,filter .18s ease,box-shadow .18s ease,background .25s ease,color .25s ease;will-change:transform;}
  button:focus-visible,.case-card:focus-visible,.pick-row:focus-visible{outline:3px solid color-mix(in srgb,var(--accent-pink) 68%,transparent);outline-offset:3px;}
  #app{width:100%;max-width:480px;min-height:100vh;position:relative;display:flex;flex-direction:column;background:linear-gradient(180deg,color-mix(in srgb,var(--accent-purple) 8%,transparent),transparent 250px);transition:max-width .25s ease;}
  body.mode-pc #app{max-width:1180px;}
  .auth-screen{width:100%;min-height:100vh;display:grid;place-items:center;padding:22px;}.auth-card{width:min(100%,390px);background:var(--surface);border:1px solid var(--border);border-radius:28px;padding:25px 21px;box-shadow:var(--shadow);}.auth-logo{display:flex;align-items:center;gap:10px;margin-bottom:20px;}.auth-logo .frog{font-size:34px;}.auth-logo b{display:block;font-family:'Baloo 2';font-size:23px;letter-spacing:.5px;color:var(--accent-green);line-height:.9;}.auth-logo span{font-family:'Baloo 2';font-size:18px;font-weight:700;}.auth-tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:13px;padding:3px;margin-bottom:18px;}.auth-tabs button{border:0;border-radius:10px;padding:10px;background:transparent;color:var(--text-muted);font:700 13px inherit;cursor:pointer;}.auth-tabs button.active{background:linear-gradient(140deg,var(--accent-purple),var(--accent-pink));color:#fff;}.auth-card label{display:block;font-size:12px;font-weight:750;margin:12px 0 6px;color:var(--text-muted);}.auth-card input{display:block;width:100%;padding:13px;background:var(--bg-2);border:1px solid var(--border);border-radius:12px;color:var(--text);font:500 14px inherit;outline:none;}.auth-card input:focus{border-color:var(--accent-pink);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent-pink) 18%,transparent);}.auth-submit{width:100%;margin-top:18px;padding:14px;border:0;border-radius:13px;background:linear-gradient(140deg,var(--accent-purple),var(--accent-pink));color:#fff;font:800 15px 'Baloo 2',sans-serif;cursor:pointer;}.auth-help{font-size:11px;color:var(--text-muted);line-height:1.45;margin:14px 2px 0;}.auth-error{min-height:18px;margin-top:10px;color:var(--accent-red);font-size:12px;font-weight:700;}

  .topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 12px;gap:10px;}
  .brand{display:flex;align-items:center;gap:9px;}.brand .frog{font-size:28px;filter:drop-shadow(0 3px 8px color-mix(in srgb,var(--accent-green) 55%,transparent));}
  .brand-text{display:flex;flex-direction:column;line-height:.92;}.brand-text b{font-family:'Baloo 2';font-size:17px;letter-spacing:.6px;color:var(--accent-green);}.brand-text span{font-family:'Baloo 2';font-size:17px;font-weight:700;letter-spacing:.5px;}
  .user-chip{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);border-radius:999px;padding:6px 10px 6px 6px;}
  .user-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(140deg,var(--accent-orange),var(--accent-pink));display:flex;align-items:center;justify-content:center;font-size:16px;position:relative;flex-shrink:0;}
  .user-level{position:absolute;bottom:-4px;right:-4px;background:var(--accent-purple);border:2px solid var(--bg-2);font-size:9px;font-weight:800;border-radius:999px;padding:1px 4px;line-height:1.2;}
  .user-meta{display:flex;flex-direction:column;line-height:1.15;}.user-meta .name{font-size:12px;font-weight:700;color:var(--text-muted);}
  .coin-btn{display:flex;align-items:center;gap:5px;background:none;border:none;color:var(--text);font-weight:800;font-size:13.5px;cursor:pointer;padding:2px 4px;border-radius:8px;}
  .coin-btn .m{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:linear-gradient(140deg,#ffe18a,var(--accent-orange));color:#3a2608;font-size:11px;font-weight:900;}
  .bell{width:36px;height:36px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}

  .page-head{padding:2px 18px 14px;}.page-head h1{font-size:25px;margin:0 0 12px;letter-spacing:.3px;}.search-row{display:flex;gap:10px;margin-bottom:12px;}
  .search-box{flex:1;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:0 14px;height:46px;box-shadow:0 8px 22px rgba(0,0,0,.04);}
  .search-box input{background:none;border:none;outline:none;color:var(--text);font-size:14px;width:100%;font-family:inherit;}.search-box input::placeholder{color:var(--text-dim);}
  .icon-btn-sq{width:46px;height:46px;border-radius:14px;background:linear-gradient(140deg,var(--accent-purple),var(--accent-pink));border:none;color:#fff;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 9px 18px color-mix(in srgb,var(--accent-purple) 25%,transparent);}
  .filter-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;}.filter-row::-webkit-scrollbar{display:none;}.chip{flex-shrink:0;border:none;cursor:pointer;font-weight:700;font-size:12.5px;padding:8px 16px;border-radius:999px;color:#fff;white-space:nowrap;}
  .page{flex:1;padding:0 18px calc(var(--nav-h) + 24px);overflow-y:auto;}body.mode-pc .page{padding-bottom:30px;}
  .page.slide-from-right{animation:page-slide-from-right .38s cubic-bezier(.2,.85,.25,1) both;}.page.slide-from-left{animation:page-slide-from-left .38s cubic-bezier(.2,.85,.25,1) both;}.page.slide-from-bottom{animation:page-slide-from-bottom .52s cubic-bezier(.14,.88,.23,1) both;}

  .case-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}body.mode-pc .case-grid{grid-template-columns:repeat(3,1fr);}
  .case-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:14px;cursor:pointer;position:relative;overflow:hidden;box-shadow:0 9px 24px rgba(0,0,0,.06);transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease;}
  .case-card::after{content:'';position:absolute;inset:-75% 35% auto -45%;height:230%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);transform:rotate(24deg) translateX(-120%);transition:transform .55s ease;pointer-events:none;}
  .case-card:hover{transform:translateY(-5px) scale(1.012);border-color:var(--case-color,var(--accent-purple));box-shadow:0 15px 30px color-mix(in srgb,var(--case-color) 18%,transparent);}.case-card:hover::after{transform:rotate(24deg) translateX(260%);}
  .case-card .glow{position:absolute;inset:0;opacity:.22;pointer-events:none;background:radial-gradient(90% 76% at 50% 18%,var(--case-color),transparent 71%);}.case-card .title{font-family:'Baloo 2';font-weight:700;font-size:14px;margin-bottom:10px;position:relative;}
  .case-box{width:100%;height:82px;border-radius:14px;margin-bottom:10px;display:flex;align-items:center;justify-content:center;font-size:36px;background:linear-gradient(155deg,var(--case-color),color-mix(in srgb,var(--case-color) 28%,var(--surface-2)));box-shadow:inset 0 1px rgba(255,255,255,.25),0 9px 22px -10px var(--case-color);position:relative;}
  .case-price{display:flex;align-items:center;gap:6px;font-weight:800;font-size:14px;color:var(--accent-orange);position:relative;}
  .case-box::before{content:'';position:absolute;width:66px;height:48px;border-radius:10px;left:50%;top:50%;transform:translate(-50%,-44%) perspective(90px) rotateX(9deg);background:linear-gradient(145deg,rgba(255,255,255,.32),rgba(0,0,0,.18));border:1px solid rgba(255,255,255,.48);box-shadow:inset 0 -8px 0 rgba(0,0,0,.14),0 10px 13px rgba(0,0,0,.2);}.case-box::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.28),transparent 23%);animation:case-glow 2.2s ease-in-out infinite alternate;pointer-events:none;}.case-icon{position:relative;z-index:1;display:grid;place-items:center;width:50px;height:41px;filter:drop-shadow(0 6px 5px rgba(0,0,0,.28));animation:case-float 2.45s ease-in-out infinite;}.case-icon::after{content:'✦';position:absolute;right:-14px;top:-14px;color:#fff;font-size:11px;text-shadow:0 0 9px #fff;animation:sparkle 1.7s ease-in-out infinite;}

  .nav-switcher{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:4px;background:var(--nav-surface);border:1px solid var(--border);border-radius:18px;isolation:isolate;backdrop-filter:blur(16px);box-shadow:var(--shadow);}
  .nav-indicator{position:absolute;z-index:0;left:4px;top:4px;bottom:4px;width:calc((100% - 8px)/5);border-radius:14px;background:linear-gradient(135deg,#1976e9,var(--accent-pink));box-shadow:0 8px 18px color-mix(in srgb,#1777e9 34%,transparent);transform:translateX(calc(var(--to) * 100%));animation:nav-slide .38s cubic-bezier(.2,.85,.25,1) both;}
  .nav-btn{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:10.5px;font-weight:750;padding:7px 2px;border-radius:12px;min-width:0;white-space:nowrap;}.nav-btn .ic{font-size:19px;line-height:1.05;}.nav-btn.active{color:#fff;}
  .bottom-nav{position:fixed;left:10px;right:10px;bottom:10px;margin:0 auto;max-width:460px;min-height:68px;z-index:50;}body.mode-pc .bottom-nav{display:none;}
  .top-nav{display:none;margin:0 18px 16px;}.top-nav .nav-btn{flex-direction:row;justify-content:center;gap:7px;font-size:13px;padding:11px 5px;}.top-nav .nav-btn .ic{font-size:16px;}body.mode-pc .top-nav{display:grid;}

  .upgrade-wrap{display:flex;flex-direction:column;gap:16px;}.upgrade-stage{position:relative;overflow:hidden;background:linear-gradient(145deg,color-mix(in srgb,var(--accent-purple) 11%,var(--surface)),var(--surface));border:1px solid var(--border);border-radius:24px;padding:14px;box-shadow:var(--shadow);}
  .upgrade-stage::before{content:'';position:absolute;width:180px;height:180px;border-radius:50%;left:50%;top:22px;transform:translateX(-50%);background:radial-gradient(circle,color-mix(in srgb,var(--accent-pink) 20%,transparent),transparent 67%);pointer-events:none;}.upgrade-stage.is-upgrading::after{content:'';position:absolute;inset:-10% 0;background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--accent-pink) 25%,transparent),transparent);animation:scan 1.2s linear infinite;pointer-events:none;}
  .upgrade-slots{display:grid;grid-template-columns:minmax(0,1fr) 52px minmax(0,1fr);align-items:stretch;gap:8px;position:relative;z-index:1;}.slot{background:color-mix(in srgb,var(--surface) 86%,transparent);border:1px solid var(--border);border-radius:18px;padding:12px;min-height:204px;display:flex;flex-direction:column;transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease;}
  .slot.has-item{border-color:color-mix(in srgb,var(--accent-pink) 55%,var(--border));}.is-upgrading .slot{animation:slot-pulse .65s ease-in-out infinite alternate;}.is-upgrading .target-slot{animation-delay:.17s;}
  .slot .label{font-size:10px;font-weight:800;color:var(--text-muted);letter-spacing:.5px;margin-bottom:8px;}.slot-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;text-align:center;}.slot-item .icon{font-size:46px;filter:drop-shadow(0 7px 9px rgba(0,0,0,.2));}.slot-item .name{font-size:11px;font-weight:700;color:var(--text-muted);line-height:1.25;}.slot-item .val{font-size:13px;font-weight:800;color:var(--accent-orange);}.slot-empty{color:var(--text-dim);font-size:11.5px;text-align:center;padding:8px;}
  .item-media{display:block;object-fit:cover;max-width:100%;}.slot-item .icon .item-media{width:58px;height:58px;border-radius:12px;}.item-card .icon .item-media{width:62px;height:62px;border-radius:13px;}.pick-row .icon .item-media{width:32px;height:32px;border-radius:9px;}.result-card .icon .item-media{width:82px;height:82px;border-radius:17px;}.reel-cell .item-media{width:68px;height:72px;border-radius:12px;}.item-media.item-emoji{display:grid;place-items:center;width:100%;height:100%;}
  .slot-pick-btn{margin-top:9px;width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);font-weight:700;font-size:11px;padding:9px 5px;border-radius:10px;cursor:pointer;}.upgrade-core{display:flex;align-items:center;justify-content:center;position:relative;min-width:0;}.upgrade-core::before{content:'';height:2px;width:42px;background:linear-gradient(90deg,var(--accent-purple),var(--accent-pink));box-shadow:0 0 13px var(--accent-pink);position:absolute;}.upgrade-orb{position:relative;width:46px;height:46px;border-radius:50%;z-index:1;display:grid;place-items:center;color:#fff;background:linear-gradient(140deg,var(--accent-purple),var(--accent-pink));border:3px solid var(--surface);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent-purple) 24%,transparent),0 0 25px color-mix(in srgb,var(--accent-pink) 55%,transparent);font-size:19px;}.is-upgrading .upgrade-orb{animation:core-spin .55s linear infinite,core-pop .55s ease-in-out infinite alternate;}
  .upgrade-status{position:relative;z-index:1;text-align:center;margin:13px 0 4px;font-size:11px;font-weight:800;letter-spacing:.75px;color:var(--text-muted);}.upgrade-status b{color:var(--accent-pink);}.chance-wrap{display:flex;flex-direction:column;align-items:center;gap:8px;padding:2px 0;}
  .wheel-shell{padding:9px;border-radius:50%;background:var(--surface);box-shadow:0 14px 30px rgba(0,0,0,.16);}.upgrade-wheel{width:176px;height:176px;border-radius:50%;position:relative;background:conic-gradient(from -90deg,var(--accent-green) 0 calc(var(--pct)*1%),var(--accent-red) 0 100%);border:5px solid var(--surface-3);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22),0 0 0 1px var(--border);}.upgrade-wheel::after{content:'';position:absolute;inset:7px;border-radius:50%;border:1px solid rgba(255,255,255,.17);pointer-events:none;}.wheel-hub{position:absolute;z-index:2;left:50%;top:50%;width:78px;height:78px;transform:translate(-50%,-50%);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);border:4px solid var(--surface);box-shadow:0 3px 10px rgba(0,0,0,.25);}.wheel-hub span{font-size:9px;font-weight:800;letter-spacing:.6px;color:var(--text-muted);}.wheel-hub b{font-family:'Baloo 2';font-size:21px;line-height:1.05;}.wheel-pointer{position:absolute;z-index:3;left:50%;top:50%;width:67px;height:5px;border-radius:9px;background:linear-gradient(90deg,#fff,#dceaff);transform-origin:0 50%;transform:rotate(-90deg);box-shadow:0 0 9px rgba(255,255,255,.85);}.wheel-pointer::after{content:'';position:absolute;right:-8px;top:50%;transform:translateY(-50%);border-top:8px solid transparent;border-bottom:8px solid transparent;border-left:14px solid #fff;filter:drop-shadow(0 0 5px rgba(255,255,255,.7));}.wheel-shell.is-spinning .wheel-pointer{animation:pointer-roll 1.45s cubic-bezier(.08,.72,.12,1) forwards;}.wheel-shell.is-spinning .upgrade-wheel{animation:wheel-glow .42s ease-in-out infinite alternate;}.wheel-legend{display:flex;gap:13px;font-size:10px;font-weight:800;letter-spacing:.25px;}.wheel-legend .win{color:var(--accent-green);}.wheel-legend .lose{color:var(--accent-red);}
  .quick-row{display:flex;gap:10px;justify-content:center;}.quick-btn{background:var(--surface);border:1px solid var(--border);color:var(--text);font-weight:700;font-size:13px;padding:10px 18px;border-radius:12px;cursor:pointer;}.quick-btn.max{background:linear-gradient(140deg,var(--accent-purple),var(--accent-pink));border:none;color:#fff;}input[type="range"]{width:100%;height:6px;border-radius:999px;background:var(--surface-2);outline:none;-webkit-appearance:none;accent-color:var(--accent-pink);}input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:linear-gradient(140deg,#ffe18a,var(--accent-orange));cursor:pointer;border:3px solid var(--bg);box-shadow:0 0 0 1px var(--border);}
  .upgrade-cta{width:100%;padding:17px;border:none;border-radius:16px;cursor:pointer;font-family:'Baloo 2';font-weight:700;font-size:17px;letter-spacing:.5px;color:#192038;background:linear-gradient(140deg,#ffe18a,var(--accent-orange));box-shadow:0 12px 26px -10px var(--accent-orange);}.upgrade-cta:disabled{opacity:.42;cursor:not-allowed;box-shadow:none;}

<script>
/* Данные каталога переданы с сервера (Python) в JSON — используются
   только для отображения (превью цели апгрейда, цвета редкости).
   Все РЕАЛЬНЫЕ изменения баланса/инвентаря происходят через fetch()
   к Flask-эндпоинтам /api/*, то есть считает сервер, а не браузер. */
const RARITY    = {{ rarity | tojson }};
const ITEM_POOL = {{ item_pool | tojson }};
const CASES     = {{ cases | tojson }};

const ui = {
  page:'cases', platform:'phone', modal:null, upgradeInputId:null, upgradeTargetId:null, upgradeChance:0,
  theme:'dark', accent:'blue', navFrom:0, upgrading:false, upgradeSpin:'0deg',
  pageMotion:'none', authMode:'register', authError:'', adminUsers:[], adminTarget:null, profiles:[]

let game = { coins:0, cases_opened:0, inventory:[], user:null };

function fmt(n){ return Math.round(n).toLocaleString('ru-RU'); }
function rColor(rarity){ return `var(--r-${rarity})`; }
function escapeHtml(value){ return String(value ?? '').replace(/[&<>'"]/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;' }[c])); }
function itemVisual(item){
  if(item.image) return `<img class="item-media" src="${item.image}" alt="${escapeHtml(item.name)}">`;
  return `<span class="item-media item-emoji">${item.icon || '✦'}</span>`;
}
function avatarVisual(){
  return game.user?.avatar_url
    ? `<img class="avatar-img" src="${game.user.avatar_url}" alt="Аватар ${escapeHtml(game.user.username)}">`
    : '<span class="avatar-fallback">🧑</span>';
}
function applyState(data){
  game.coins = data.coins; game.cases_opened = data.cases_opened;
  game.inventory = data.inventory || []; game.user = data.user || null;
}
function findNearestItem(value){
  let best=ITEM_POOL[0], bestDiff=Infinity;
  for(const it of ITEM_POOL){ const d=Math.abs(it.value-value); if(d<bestDiff){bestDiff=d; best=it;} }
  return best;
}
function upgradeSpinFor(success, chance){
  const greenAngle = chance * 3.6;
  const landingAngle = success
    ? Math.max(2, Math.min(greenAngle - 2, greenAngle * .5))
    : Math.min(355, greenAngle + Math.max(14, (360 - greenAngle) * .5));
  return `${(1800 + landingAngle).toFixed(1)}deg`;
}

async function api(path, opts={}){
  const isForm = opts.body instanceof FormData;
  const headers = Object.assign({}, isForm ? {} : {'Content-Type':'application/json'}, opts.headers || {});
  const res = await fetch(path, Object.assign({}, opts, {headers}));
  const data = await res.json().catch(()=>({}));
  if(!res.ok){ throw new Error(data.error || 'request_failed'); }
  return data;
}

async function refreshFromServer(){
  const d = await api('/api/state');
  applyState(d);
}
function upgradeChanceFor(input, target){
  if(!input || !target || target.value<=input.value) return 0;
  return Math.max(2, Math.min(95, input.value / target.value * 100));
}
function sortedCharacters(){ return [...ITEM_POOL].sort((a,b)=>a.value-b.value); }

function toast(msg){
  const el = document.getElementById('toast');
  if(!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>el.classList.remove('show'), 2600);
}

      <div class="profile-row" data-action="view-profile" data-id="${profile.id}">
        <div class="profile-avatar">${profile.avatar_url ? `<img class="avatar-img" src="${profile.avatar_url}" alt="">` : '🧑'}</div>
        <div><div class="profile-name">${escapeHtml(profile.username)}${profile.is_admin?' 🛡️':''}</div><div class="profile-sub">${profile.items} предметов · ${profile.cases_opened} кейсов</div></div>
        <div class="profile-value">${profile.top_item ? `${fmt(profile.top_item.value)} M<br><span style="color:var(--text-muted);font-size:9px">топ-дроп</span>` : 'Нет дропа'}</div>
      </div>`).join('')}</div>` : `<div class="empty-state"><span class="em">👥</span>Пока нет доступных профилей.</div>`;
  }

  if(m.type==='profileDetail'){
    const profile = ui.profiles.find(entry=>String(entry.id)===String(m.data.id));
    title='Профиль игрока';
    body = profile ? `<div class="profile-detail">
      <div class="profile-avatar">${profile.avatar_url ? `<img class="avatar-img" src="${profile.avatar_url}" alt="">` : '🧑'}</div>
      <div class="drop-name">${escapeHtml(profile.username)}${profile.is_admin?' 🛡️':''}</div>
      <div style="font-size:11px;color:var(--text-muted)">${profile.cases_opened} кейсов · ${profile.items} предметов · ${fmt(profile.total)} M</div>
      ${profile.top_item ? `<div class="top-drop" style="width:100%;margin-top:8px"><div class="top-drop-image">${itemVisual(profile.top_item)}</div><div><div class="eyebrow">ЛУЧШИЙ ДРОП</div><div class="drop-name">${escapeHtml(profile.top_item.name)}</div><div class="drop-rarity" style="color:${rColor(profile.top_item.rarity)}">${RARITY[profile.top_item.rarity].label}</div></div><div class="drop-value">${fmt(profile.top_item.value)} M</div></div>` : '<div class="empty-state" style="padding:20px">У игрока ещё нет дропов.</div>'}
    </div>` : '<div class="empty-state">Профиль не найден.</div>';
  }

  if(m.type==='caseOpen'){
    title = m.data.caseName;
    body = `
      <div class="reel-intro"><span>ОТКРЫТИЕ КЕЙСА</span><b id="reelStatus">ПОДГОТОВКА...</b></div>
      <div class="reel-outer" id="reelOuter"><div class="reel-marker"></div>
        <div class="reel-track" id="reelTrack">
          ${m.data.strip.map((it,index)=>`<div class="reel-cell ${index===m.data.winIndex?'winner':''}" style="--item-color:${rColor(it.rarity)}">${itemVisual(it)}<div class="reel-name">${escapeHtml(it.name)}</div><div class="reel-type">${escapeHtml(it.type || 'Персонаж')}</div><div class="reel-price">${fmt(it.value)} M</div><i class="rarity-dot"></i></div>`).join('')}
        </div>
      </div>
      <div class="case-progress" id="reelProgress"><div class="bar"><span></span></div><span class="status">Сканирование</span></div>
      <div id="reelResult"></div>
    `;
  }

  if(m.type==='upgradeResult'){
    title = m.data.success ? '🎉 Успех!' : '💥 Неудача';
    const it = m.data.item;
    body = `
      <div class="result-card">
        <div class="icon">${itemVisual(it)}</div>
        <div class="name">${it.name}</div>
        <div class="rarity" style="color:${rColor(it.rarity)}">${RARITY[it.rarity].label}</div>
        ${m.data.success
          ? `<div class="value">+${fmt(it.value)} M получено</div>`
          : `<div class="value" style="color:var(--accent-red)">Предмет утерян</div>`}
      </div>
      <button class="primary-btn" data-action="close-modal">Понятно</button>
    `;
  }

  return `
    <div class="modal-overlay open ${m.type==='caseOpen'?'case-open-overlay':''}" id="overlay">
      <div class="modal-sheet">
        <div class="modal-head"><h3>${title}</h3><button class="modal-close" data-action="close-modal">✕</button></div>
        ${body}
      </div>
    </div>
  `;
}

/* ======================= ACTIONS ======================= */
let navReleaseTimer;
function goto(page){
  if(page===ui.page) return;
  const previous = tabIndex(ui.page);
  ui.navFrom = previous;
  // Переход из кейсов в апгрейдер уходит снизу, как отдельный игровой экран.
  ui.pageMotion = ui.page==='cases' && page==='upgrade' ? 'bottom' : (tabIndex(page) > previous ? 'right' : 'left');
  ui.page = page;
  ui.modal = null;
  render();
  clearTimeout(navReleaseTimer);
  navReleaseTimer = setTimeout(()=>{ ui.navFrom = tabIndex(ui.page); }, 450);
}

async function openCase(caseId){
  const c = CASES.find(x=>x.id===caseId);
  if(!c) return;
  if(game.coins < c.price){ toast('Недостаточно монет 😢'); return; }

  // визуальная рулетка: реальный выигрыш запрашиваем у сервера сразу,
  // сервер уже посчитал вес редкости и списал монеты
  let data;
  try{
    data = await api(`/api/open_case/${caseId}`, {method:'POST'});
  }catch(e){
    toast('Не получилось открыть кейс 😢');
    return;
  }
  const won = data.won;
  const strip = [];
  const winIndex = 27;
  const caseItems = ITEM_POOL.filter(item=>item.value>=c.min_value && item.value<=c.max_value);
  for(let i=0;i<35;i++) strip.push(caseItems[Math.floor(Math.random()*caseItems.length)]);
  strip[winIndex] = won;

  ui.modal = { type:'caseOpen', data:{ caseName:c.name, strip, winIndex } };
  render();

  requestAnimationFrame(()=>{
    const track = document.getElementById('reelTrack');
    const outer = document.getElementById('reelOuter');
    const winner = track?.querySelector('.winner');
    const progress = document.getElementById('reelProgress');
    const status = document.getElementById('reelStatus');
    if(!track || !outer || !winner) return;
    const targetX = outer.clientWidth/2 - winner.offsetLeft - winner.offsetWidth/2 + (Math.random()*8-4);
    requestAnimationFrame(()=>{
      progress?.classList.add('running');
      track.style.transition = 'transform 3.35s cubic-bezier(.08,.78,.1,1)';
      track.style.transform = `translateX(${targetX}px)`;
    });
    setTimeout(()=>{
      outer.classList.add('complete');
      if(status) status.textContent = 'РЕЗУЛЬТАТ!';
      if(progress){ progress.classList.remove('running'); progress.querySelector('.status').textContent = 'Готово'; }
      game.coins = data.coins; game.cases_opened = data.cases_opened; game.inventory = data.inventory;
      const rC = document.getElementById('reelResult');
      if(rC){
        rC.innerHTML = `
          <div class="result-card">
            <div class="icon">${itemVisual(won)}</div>
            <div class="name">${won.name}</div>
            <div class="rarity" style="color:${rColor(won.rarity)}">${RARITY[won.rarity].label}</div>
            <div class="value">${fmt(won.value)} M</div>
          </div>
          <button class="primary-btn" data-action="close-modal">Забрать</button>
        `;
        bindEvents();
      }
    }, 3550);
  });
}

async function doUpgrade(){
  const input = game.inventory.find(i=>i.instance_id===ui.upgradeInputId);
  const target = ITEM_POOL.find(item=>item.id===ui.upgradeTargetId);
  const chance = upgradeChanceFor(input,target);
  if(!input || !target || !chance || ui.upgrading) return;
  let data;
  try{
    data = await api('/api/upgrade', {
      method:'POST',
      body: JSON.stringify({ instance_id: input.instance_id, target_id: target.id })
    });
  }catch(e){
    toast('Ошибка апгрейда 😢');
    return;
  }
  ui.upgradeSpin = upgradeSpinFor(data.success, data.chance);
  ui.upgrading = true;
  render();
  setTimeout(()=>{
    game.coins = data.coins; game.inventory = data.inventory;
    ui.upgradeInputId = null;
    ui.upgradeTargetId = null;
    ui.upgrading = false;
    ui.upgradeSpin = '0deg';
    ui.modal = { type:'upgradeResult', data:{ success:data.success, item:data.item } };
    render();
  }, 1450);
}

async function sellItem(instanceId){
  const item = game.inventory.find(entry=>entry.instance_id===instanceId);
  if(!item) return;
  try{
    const data = await api('/api/sell', {method:'POST', body:JSON.stringify({instance_id:instanceId})});
    applyState(data);
    if(ui.upgradeInputId===instanceId) ui.upgradeInputId = null;
    render();
    toast(`Продано: ${item.name} · +${fmt(data.earned)} M`);
  }catch(error){
    toast(error.message==='item_not_found' ? 'Этот предмет уже продан' : 'Не удалось продать предмет');
  }

}

async function openProfiles(){
  try{
    const data = await api('/api/profiles');
    ui.profiles = data.profiles || [];
    ui.modal = {type:'profiles'};
    render();
  }catch(error){ toast('Не удалось загрузить профили игроков'); }
}

function authErrorMessage(error){
  return ({
    invalid_username:'Никнейм: 3–24 символа, только буквы, цифры, _ или -.',
    invalid_password:'Пароль должен содержать от 4 до 128 символов.',
    username_taken:'Этот никнейм уже занят.', invalid_credentials:'Неверный никнейм или пароль.',
    banned:'Этот аккаунт заблокирован.', auth_required:'Войдите в аккаунт.'
  })[error] || 'Не удалось выполнить действие. Попробуйте ещё раз.';
}

async function authenticate(){
  const username = document.getElementById('authUsername')?.value.trim() || '';
  const password = document.getElementById('authPassword')?.value || '';
  try{
    const data = await api(`/api/${ui.authMode}`, {method:'POST', body:JSON.stringify({username,password})});
    applyState(data);
    ui.authError = '';
    ui.page = 'cases';
    render();
    toast(ui.authMode==='register' ? 'Аккаунт создан. Добро пожаловать!' : 'С возвращением!');
  }catch(error){
    ui.authError = authErrorMessage(error.message);
    render();
  }
}

async function uploadAvatar(file){
  if(!file) return;
  if(file.size > 2 * 1024 * 1024){ toast('Размер аватара — до 2 МБ'); return; }
  const form = new FormData();
  form.append('avatar', file);
  try{
    const data = await api('/api/avatar', {method:'POST', body:form});
    applyState(data);
    render();
    toast('Аватар обновлён');
  }catch(error){ toast(error.message==='avatar_format' ? 'Поддерживаются PNG, JPG, WEBP и GIF' : 'Не удалось загрузить аватар'); }
}

async function openAdmin(){
  try{
    const data = await api('/api/admin/users');
    ui.adminUsers = data.users || [];
    ui.adminTarget = ui.adminUsers.find(user=>user.id!==game.user.id)?.id || null;
    ui.modal = {type:'admin'};
    render();
  }catch(error){ toast('Не удалось открыть админ-панель'); }
}

async function refreshAdmin(){
  const data = await api('/api/admin/users');
  ui.adminUsers = data.users || [];
}

async function adminAction(action, extra={}){
  if(!ui.adminTarget) return;
  try{
    const data = await api('/api/admin/action', {method:'POST', body:JSON.stringify({action, target_id:ui.adminTarget, ...extra})});
    await refreshAdmin();
    ui.modal = {type:'admin'};
    render();
    toast(data.message);
  }catch(error){ toast(error.message==='self_action_forbidden' ? 'Нельзя применить это действие к себе' : 'Не удалось выполнить действие'); }
}

async function logout(){
  await api('/api/logout', {method:'POST'}).catch(()=>{});
  game = {coins:0, cases_opened:0, inventory:[], user:null};
  ui.modal = null;
  ui.authMode = 'login';
  ui.authError = '';
  render();
}

/* ======================= EVENT BINDING ======================= */
function bindEvents(){
  document.querySelectorAll('[data-action]').forEach(el=>{
    el.onclick = ()=>{
      const a = el.dataset.action;
      if(a==='goto') goto(el.dataset.page);
      else if(a==='auth-mode'){ ui.authMode=el.dataset.mode; ui.authError=''; render(); }
      else if(a==='auth-submit') authenticate();
      else if(a==='open-buy'){ ui.modal={type:'buy'}; render(); }
      else if(a==='open-settings'){ ui.modal={type:'settings'}; render(); }
      else if(a==='open-profiles'){ openProfiles(); }
      else if(a==='open-admin'){ openAdmin(); }
      else if(a==='open-pick-input'){ ui.modal={type:'pickInput'}; render(); }
      else if(a==='open-pick-target'){ ui.modal={type:'pickTarget'}; render(); }
      else if(a==='close-modal'){ ui.modal=null; render(); }
      else if(a==='open-case'){ openCase(el.dataset.case); }
      else if(a==='sell-item'){ sellItem(el.dataset.id); }
      else if(a==='view-profile'){ ui.modal={type:'profileDetail',data:{id:el.dataset.id}}; render(); }
      else if(a==='admin-coins') adminAction('coins', {amount:document.getElementById('adminCoins')?.value});
      else if(a==='admin-character') adminAction('character', {item_id:document.getElementById('adminCharacter')?.value});
      else if(a==='admin-ban') adminAction('ban', {banned:el.dataset.ban==='true'});
      else if(a==='admin-refresh') refreshAdmin().then(()=>render()).catch(()=>toast('Не удалось обновить список'));
      else if(a==='logout') logout();
      else if(a==='set-platform'){ ui.platform = el.dataset.platform; render(); }
      else if(a==='set-theme'){ ui.theme = el.dataset.theme; render(); }
      else if(a==='set-accent'){ ui.accent = el.dataset.accent; render(); }
      else if(a==='pick-input-item'){ ui.upgradeInputId = el.dataset.id; const input=game.inventory.find(item=>item.instance_id===el.dataset.id); const target=ITEM_POOL.find(item=>item.id===ui.upgradeTargetId); if(target && (!input || target.value<=input.value)) ui.upgradeTargetId=null; ui.modal=null; render(); }
      else if(a==='pick-target-item'){ ui.upgradeTargetId=el.dataset.id; ui.modal=null; render(); }
      else if(a==='do-upgrade'){ doUpgrade(); }
    };
  });
  const overlay = document.getElementById('overlay');
  if(overlay) overlay.addEventListener('click', (e)=>{ if(e.target===overlay){ ui.modal=null; render(); } });
  const avatar = document.querySelector('[data-action="avatar-file"]');
  if(avatar) avatar.addEventListener('change', (e)=>uploadAvatar(e.target.files?.[0]));
  const adminTarget = document.querySelector('[data-action="admin-target"]');
  if(adminTarget) adminTarget.addEventListener('change', (e)=>{ ui.adminTarget=e.target.value; render(); });
}

(async function init(){
  try{
    await refreshFromServer();
  }catch(error){
    if(error.message==='banned') ui.authError='Этот аккаунт заблокирован.';
  }
  render();
})();
</script>
